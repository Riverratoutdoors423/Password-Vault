<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Vault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f172a; color: white; max-width: 480px; margin: 0 auto; min-height: 100vh; }
        
        .screen { display: none; min-height: 100vh; padding: 20px; }
        .screen.active { display: flex; flex-direction: column; }
        
        /* Login */
        #loginScreen { justify-content: center; align-items: center; background: linear-gradient(135deg, #1e1b4b, #312e81); }
        .login-box { background: white; color: #1e293b; padding: 40px; border-radius: 20px; width: 90%; max-width: 340px; text-align: center; }
        .login-box h1 { font-size: 24px; margin-bottom: 8px; }
        .login-box p { color: #64748b; margin-bottom: 24px; font-size: 14px; }
        .login-box input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; margin-bottom: 12px; }
        .login-box button { width: 100%; padding: 14px; background: #6366f1; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; }
        .login-box button:hover { background: #4f46e5; }
        .hint-text { font-size: 12px; color: #94a3b8; margin-top: 16px; }
        
        /* Main App */
        #mainScreen { background: #0f172a; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-top: 10px; }
        .header h2 { font-size: 22px; }
        .header button { background: #1e293b; border: none; color: white; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 14px; }
        
        .search-box { margin-bottom: 16px; }
        .search-box input { width: 100%; padding: 12px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 15px; }
        .search-box input::placeholder { color: #64748b; }
        
        .category-tabs { display: flex; gap: 8px; margin-bottom: 16px; overflow-x: auto; }
        .tab { padding: 8px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 20px; font-size: 13px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: #6366f1; border-color: #6366f1; }
        
        .password-list { flex: 1; overflow-y: auto; }
        .password-item { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
        .password-item:hover { border-color: #6366f1; }
        .password-site { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .password-user { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        .password-meta { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; }
        .strength { padding: 2px 8px; border-radius: 10px; font-size: 11px; font-weight: 600; }
        .strength-weak { background: #7f1d1d; color: #fca5a5; }
        .strength-medium { background: #713f12; color: #fde047; }
        .strength-strong { background: #064e3b; color: #6ee7b7; }
        
        .fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; background: #6366f1; color: white; border: none; border-radius: 30px; font-size: 28px; cursor: pointer; box-shadow: 0 4px 20px rgba(99,102,241,0.4); }
        
        /* Modal */
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .modal-header h3 { font-size: 20px; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; letter-spacing: 0.5px; }
        .form-group input, .form-group select { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 15px; }
        .password-row { display: flex; gap: 8px; }
        .password-row input { flex: 1; }
        .password-row button { padding: 12px 16px; background: #334155; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 13px; }
        
        .btn-primary { width: 100%; padding: 14px; background: #6366f1; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn-danger { width: 100%; padding: 12px; background: #7f1d1d; color: #fca5a5; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 8px; }
        
        .empty { text-align: center; padding: 60px 20px; color: #64748b; }
        .empty-icon { font-size: 48px; margin-bottom: 12px; }
        
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 12px 24px; border-radius: 8px; font-size: 14px; opacity: 0; transition: opacity 0.3s; z-index: 2000; }
        .toast.show { opacity: 1; }
    </style>
</head>
<body>
    <!-- Login Screen -->
    <div id="loginScreen" class="screen active">
        <div class="login-box">
            <h1>🔐 Password Vault</h1>
            <p>Secure local storage</p>
            <input type="password" id="masterPass" placeholder="Create or enter master password">
            <button onclick="unlock()">Unlock</button>
            <p class="hint-text" id="loginHint">First time? Enter a new password to create vault</p>
        </div>
    </div>

    <!-- Main Screen -->
    <div id="mainScreen" class="screen">
        <div class="header">
            <h2>My Vault</h2>
            <div>
                <button onclick="exportData()">💾 Export</button>
                <button onclick="lock()">🔒 Lock</button>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="search" placeholder="Search passwords..." oninput="renderList()">
        </div>
        
        <div class="category-tabs">
            <div class="tab active" onclick="setCat('all', this)">All</div>
            <div class="tab" onclick="setCat('work', this)">Work</div>
            <div class="tab" onclick="setCat('scada', this)">SCADA</div>
            <div class="tab" onclick="setCat('personal', this)">Personal</div>
        </div>
        
        <div class="password-list" id="list">
            <div class="empty">
                <div class="empty-icon">🔐</div>
                <p>No passwords yet</p>
                <p style="font-size: 13px; margin-top: 4px;">Tap + to add one</p>
            </div>
        </div>
        
        <button class="fab" onclick="openAdd()">+</button>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="modalTitle">Add Password</h3>
                <button class="close-btn" onclick="closeModal()">×</button>
            </div>
            
            <div class="form-group">
                <label>Category</label>
                <select id="cat">
                    <option value="work">Work</option>
                    <option value="scada">SCADA</option>
                    <option value="personal">Personal</option>
                    <option value="finance">Finance</option>
                </select>
            </div>
            
            <div class="form-group">
                <label>Site / App Name</label>
                <input type="text" id="site" placeholder="e.g., Company Laptop">
            </div>
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="user" placeholder="username@email.com">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="password-row">
                    <input type="password" id="pass" placeholder="Enter password">
                    <button onclick="genPass()">Generate</button>
                </div>
            </div>
            
            <button class="btn-primary" onclick="save()">Save Password</button>
            <button class="btn-danger hidden" id="delBtn" onclick="deleteEntry()">Delete</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        // Data storage
        let vault = [];
        let masterKey = '';
        let currentCat = 'all';
        let editingId = null;

        // Check if vault exists
        const saved = localStorage.getItem('pv_data');
        const savedKey = localStorage.getItem('pv_key');
        
        if (saved && savedKey) {
            document.getElementById('loginHint').textContent = 'Enter your master password to unlock';
        }

        function unlock() {
            const pass = document.getElementById('masterPass').value;
            if (!pass) {
                showToast('Enter password');
                return;
            }

            // Simple hash check
            const hash = simpleHash(pass);
            
            if (saved && savedKey) {
                // Existing vault
                if (hash !== savedKey) {
                    showToast('Wrong password');
                    return;
                }
                // Decrypt
                vault = JSON.parse(xorDecrypt(saved, pass));
            } else {
                // New vault
                localStorage.setItem('pv_key', hash);
                vault = [];
            }

            masterKey = pass;
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('mainScreen').classList.add('active');
            renderList();
            showToast('Vault unlocked');
        }

        function lock() {
            masterKey = '';
            document.getElementById('mainScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('masterPass').value = '';
        }

        function openAdd() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add Password';
            document.getElementById('delBtn').classList.add('hidden');
            document.getElementById('cat').value = 'work';
            document.getElementById('site').value = '';
            document.getElementById('user').value = '';
            document.getElementById('pass').value = '';
            document.getElementById('modal').classList.add('active');
        }

        function closeModal() {
            document.getElementById('modal').classList.remove('active');
        }

        function save() {
            const cat = document.getElementById('cat').value;
            const site = document.getElementById('site').value;
            const user = document.getElementById('user').value;
            const pass = document.getElementById('pass').value;

            if (!site || !pass) {
                showToast('Site and password required');
                return;
            }

            const entry = {
                id: editingId || Date.now(),
                cat,
                site,
                user,
                pass,
                updated: new Date().toLocaleDateString(),
                strength: checkStrength(pass)
            };

            if (editingId) {
                const idx = vault.findIndex(v => v.id === editingId);
                vault[idx] = entry;
            } else {
                vault.push(entry);
            }

            saveVault();
            renderList();
            closeModal();
            showToast('Saved');
        }

        function deleteEntry() {
            vault = vault.filter(v => v.id !== editingId);
            saveVault();
            renderList();
            closeModal();
            showToast('Deleted');
        }

        function saveVault() {
            const encrypted = xorEncrypt(JSON.stringify(vault), masterKey);
            localStorage.setItem('pv_data', encrypted);
        }

        function renderList() {
            const search = document.getElementById('search').value.toLowerCase();
            const list = document.getElementById('list');
            
            let filtered = vault;
            
            if (currentCat !== 'all') {
                filtered = filtered.filter(v => v.cat === currentCat);
            }
            
            if (search) {
                filtered = filtered.filter(v => 
                    v.site.toLowerCase().includes(search) ||
                    v.user.toLowerCase().includes(search)
                );
            }

            if (filtered.length === 0) {
                list.innerHTML = `
                    <div class="empty">
                        <div class="empty-icon">🔐</div>
                        <p>${search ? 'No matches found' : 'No passwords yet'}</p>
                    </div>
                `;
                return;
            }

            list.innerHTML = filtered.map(v => `
                <div class="password-item" onclick="edit(${v.id})">
                    <div class="password-site">${escape(v.site)}</div>
                    <div class="password-user">${escape(v.user) || 'No username'}</div>
                    <div class="password-meta">
                        <span>Updated: ${v.updated}</span>
                        <span class="strength strength-${v.strength}">${v.strength}</span>
                    </div>
                </div>
            `).join('');
        }

        function edit(id) {
            const entry = vault.find(v => v.id === id);
            if (!entry) return;
            
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Password';
            document.getElementById('delBtn').classList.remove('hidden');
            document.getElementById('cat').value = entry.cat;
            document.getElementById('site').value = entry.site;
            document.getElementById('user').value = entry.user;
            document.getElementById('pass').value = entry.pass;
            document.getElementById('modal').classList.add('active');
        }

        function setCat(cat, el) {
            currentCat = cat;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            el.classList.add('active');
            renderList();
        }

        function genPass() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
            let pass = '';
            for (let i = 0; i < 16; i++) {
                pass += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            document.getElementById('pass').value = pass;
            document.getElementById('pass').type = 'text';
            showToast('Password generated');
        }

        function exportData() {
            const data = JSON.stringify(vault, null, 2);
            const blob = new Blob([data], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `vault-backup-${new Date().toISOString().split('T')[0]}.json`;
            a.click();
            showToast('Backup downloaded');
        }

        function checkStrength(pass) {
            let score = 0;
            if (pass.length > 8) score++;
            if (pass.match(/[A-Z]/)) score++;
            if (pass.match(/[0-9]/)) score++;
            if (pass.match(/[^A-Za-z0-9]/)) score++;
            
            if (score < 2) return 'weak';
            if (score < 4) return 'medium';
            return 'strong';
        }

        function simpleHash(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) {
                const char = str.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash;
            }
            return hash.toString(16);
        }

        function xorEncrypt(text, key) {
            let result = '';
            for (let i = 0; i < text.length; i++) {
                result += String.fromCharCode(text.charCodeAt(i) ^ key.charCodeAt(i % key.length));
            }
            return btoa(result);
        }

        function xorDecrypt(text, key) {
            try {
                const decoded = atob(text);
                let result = '';
                for (let i = 0; i < decoded.length; i++) {
                    result += String.fromCharCode(decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length));
                }
                return result;
            } catch (e) {
                return '[]';
            }
        }

        function escape(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            toast.textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }

        // Close modal on outside click
        document.getElementById('modal').addEventListener('click', (e) => {
            if (e.target === document.getElementById('modal')) closeModal();
        });
    </script>
</body>
</html>
