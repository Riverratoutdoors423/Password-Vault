<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Password Vault</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
        body { background: #0f172a; color: white; max-width: 480px; margin: 0 auto; min-height: 100vh; }
        .screen { display: none; min-height: 100vh; padding: 20px; }
        .screen.active { display: flex; flex-direction: column; }
        
        #loginScreen { justify-content: center; align-items: center; background: linear-gradient(135deg, #1e1b4b, #312e81); }
        .login-box { background: white; color: #1e293b; padding: 40px; border-radius: 20px; width: 90%; max-width: 340px; }
        .login-box h1 { font-size: 24px; margin-bottom: 8px; text-align: center; }
        .login-box p { color: #64748b; margin-bottom: 24px; text-align: center; font-size: 14px; }
        .login-box input { width: 100%; padding: 14px; border: 2px solid #e2e8f0; border-radius: 10px; font-size: 16px; margin-bottom: 12px; }
        .login-box button { width: 100%; padding: 14px; background: #6366f1; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-bottom: 8px; }
        .error { color: #dc2626; font-size: 13px; text-align: center; margin-top: 12px; display: none; }
        
        #mainScreen { background: #0f172a; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; padding-top: 10px; }
        .header h2 { font-size: 22px; }
        .header button { background: #1e293b; border: none; color: white; padding: 10px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-left: 8px; }
        
        .search-box { margin-bottom: 16px; }
        .search-box input { width: 100%; padding: 12px 16px; background: #1e293b; border: 1px solid #334155; border-radius: 10px; color: white; font-size: 15px; }
        
        .list { flex: 1; overflow-y: auto; }
        .item { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 16px; margin-bottom: 12px; cursor: pointer; }
        .item:hover { border-color: #6366f1; }
        .site { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .user { font-size: 14px; color: #94a3b8; margin-bottom: 8px; }
        .meta { display: flex; justify-content: space-between; font-size: 12px; color: #64748b; }
        .cat-tag { text-transform: uppercase; font-size: 10px; background: #334155; padding: 2px 8px; border-radius: 10px; }
        
        .fab { position: fixed; bottom: 24px; right: 24px; width: 60px; height: 60px; background: #6366f1; color: white; border: none; border-radius: 30px; font-size: 28px; cursor: pointer; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.8); z-index: 1000; justify-content: center; align-items: flex-end; }
        .modal.active { display: flex; }
        .modal-content { background: #1e293b; width: 100%; max-width: 480px; border-radius: 20px 20px 0 0; padding: 24px; max-height: 90vh; overflow-y: auto; }
        .modal-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .close-btn { background: none; border: none; color: #94a3b8; font-size: 24px; cursor: pointer; }
        
        .form-group { margin-bottom: 16px; }
        .form-group label { display: block; font-size: 12px; color: #94a3b8; margin-bottom: 6px; text-transform: uppercase; }
        .form-group input { width: 100%; padding: 12px; background: #0f172a; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 15px; }
        
        .password-row { display: flex; gap: 8px; }
        .password-row input { flex: 1; }
        .password-row button { padding: 12px 16px; background: #334155; border: none; border-radius: 8px; color: white; cursor: pointer; font-size: 13px; }
        
        .btn-primary { width: 100%; padding: 14px; background: #6366f1; color: white; border: none; border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 8px; }
        .btn-secondary { width: 100%; padding: 12px; background: #334155; color: white; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 8px; }
        .btn-danger { width: 100%; padding: 12px; background: #7f1d1d; color: #fca5a5; border: none; border-radius: 10px; font-size: 14px; cursor: pointer; margin-top: 8px; }
        
        .empty { text-align: center; padding: 60px 20px; color: #64748b; }
        .toast { position: fixed; bottom: 100px; left: 50%; transform: translateX(-50%); background: #10b981; color: white; padding: 12px 24px; border-radius: 8px; opacity: 0; transition: opacity 0.3s; z-index: 2000; }
        .toast.show { opacity: 1; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <!-- Login -->
    <div id="loginScreen" class="screen active">
        <div class="login-box">
            <h1>🔐 Password Vault</h1>
            <p id="loginText">Create account</p>
            <input type="text" id="loginUser" placeholder="Username">
            <input type="password" id="loginPass" placeholder="Master Password">
            <button onclick="doLogin()">Login</button>
            <div class="error" id="errorMsg">Wrong username or password</div>
        </div>
    </div>

    <!-- Main -->
    <div id="mainScreen" class="screen">
        <div class="header">
            <h2 id="welcomeUser">My Vault</h2>
            <div>
                <button onclick="openChangePass()">🔑 Change</button>
                <button onclick="doLock()">🔒 Lock</button>
            </div>
        </div>
        
        <div class="search-box">
            <input type="text" id="search" placeholder="Search..." oninput="render()">
        </div>
        
        <div class="list" id="list">
            <div class="empty">No passwords yet. Tap + to add.</div>
        </div>
        
        <button class="fab" onclick="openAdd()">+</button>
    </div>

    <!-- Add Modal -->
    <div class="modal" id="modal" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3 id="modalTitle">Add Password</h3>
                <button class="close-btn" onclick="document.getElementById('modal').classList.remove('active')">×</button>
            </div>
            
            <div class="form-group">
                <label>Category (type anything)</label>
                <input type="text" id="cat" placeholder="Work, School, Gym, etc.">
            </div>
            
            <div class="form-group">
                <label>Site Name</label>
                <input type="text" id="site" placeholder="e.g., Laptop Login">
            </div>
            
            <div class="form-group">
                <label>Username</label>
                <input type="text" id="user" placeholder="username">
            </div>
            
            <div class="form-group">
                <label>Password</label>
                <div class="password-row">
                    <input type="password" id="pass" placeholder="password">
                    <button onclick="genPass()">Gen</button>
                </div>
            </div>
            
            <button class="btn-primary" onclick="save()">Save</button>
            <button class="btn-danger hidden" id="delBtn" onclick="deleteItem()">Delete</button>
        </div>
    </div>

    <!-- Change Password Modal -->
    <div class="modal" id="changeModal" onclick="if(event.target===this)this.classList.remove('active')">
        <div class="modal-content" onclick="event.stopPropagation()">
            <div class="modal-header">
                <h3>Change Master Password</h3>
                <button class="close-btn" onclick="document.getElementById('changeModal').classList.remove('active')">×</button>
            </div>
            
            <div class="form-group">
                <label>Current Password</label>
                <input type="password" id="oldPass" placeholder="Current password">
            </div>
            
            <div class="form-group">
                <label>New Password</label>
                <input type="password" id="newPass" placeholder="New password">
            </div>
            
            <div class="form-group">
                <label>Confirm New Password</label>
                <input type="password" id="confirmPass" placeholder="Confirm new password">
            </div>
            
            <button class="btn-primary" onclick="changePass()">Change Password</button>
            <button class="btn-secondary" onclick="document.getElementById('changeModal').classList.remove('active')">Cancel</button>
        </div>
    </div>

    <div class="toast" id="toast"></div>

    <script>
        const KEY_USER = 'pv_user';
        const KEY_PASS = 'pv_pass';
        const KEY_DATA = 'pv_data';
        
        let currentUser = '';
        let currentPass = '';
        let passwords = [];
        let editingId = null;

        // Check if account exists
        const savedUser = localStorage.getItem(KEY_USER);
        if (savedUser) {
            document.getElementById('loginText').textContent = 'Enter username and password';
            document.getElementById('loginUser').value = savedUser;
        }

        function doLogin() {
            const user = document.getElementById('loginUser').value.trim();
            const pass = document.getElementById('loginPass').value;
            const error = document.getElementById('errorMsg');
            
            if (!user || !pass) {
                error.textContent = 'Enter username and password';
                error.style.display = 'block';
                return;
            }
            
            if (!savedUser) {
                // Create new account
                localStorage.setItem(KEY_USER, user);
                localStorage.setItem(KEY_PASS, pass);
                localStorage.setItem(KEY_DATA, '[]');
                currentUser = user;
                currentPass = pass;
                passwords = [];
                enterApp();
                showToast('Account created');
            } else {
                // Check login
                const savedPass = localStorage.getItem(KEY_PASS);
                if (user === savedUser && pass === savedPass) {
                    currentUser = user;
                    currentPass = pass;
                    const data = localStorage.getItem(KEY_DATA);
                    passwords = data ? JSON.parse(data) : [];
                    enterApp();
                } else {
                    error.textContent = 'Wrong username or password';
                    error.style.display = 'block';
                }
            }
        }

        function enterApp() {
            document.getElementById('loginScreen').classList.remove('active');
            document.getElementById('mainScreen').classList.add('active');
            document.getElementById('errorMsg').style.display = 'none';
            document.getElementById('welcomeUser').textContent = currentUser + "'s Vault";
            render();
        }

        function doLock() {
            currentUser = '';
            currentPass = '';
            passwords = [];
            document.getElementById('mainScreen').classList.remove('active');
            document.getElementById('loginScreen').classList.add('active');
            document.getElementById('loginPass').value = '';
        }

        function openAdd() {
            editingId = null;
            document.getElementById('modalTitle').textContent = 'Add Password';
            document.getElementById('delBtn').classList.add('hidden');
            document.getElementById('cat').value = '';
            document.getElementById('site').value = '';
            document.getElementById('user').value = '';
            document.getElementById('pass').value = '';
            document.getElementById('modal').classList.add('active');
        }

        function save() {
            const cat = document.getElementById('cat').value.trim() || 'Other';
            const site = document.getElementById('site').value.trim();
            const user = document.getElementById('user').value.trim();
            const pass = document.getElementById('pass').value;
            
            if (!site || !pass) {
                showToast('Site and password required');
                return;
            }
            
            const item = {
                id: editingId || Date.now(),
                cat: cat,
                site: site,
                user: user,
                pass: pass,
                updated: new Date().toLocaleDateString()
            };
            
            if (editingId) {
                const idx = passwords.findIndex(p => p.id === editingId);
                passwords[idx] = item;
            } else {
                passwords.push(item);
            }
            
            // SAVE TO STORAGE
            localStorage.setItem(KEY_DATA, JSON.stringify(passwords));
            
            render();
            document.getElementById('modal').classList.remove('active');
            showToast('Saved successfully');
        }

        function deleteItem() {
            passwords = passwords.filter(p => p.id !== editingId);
            localStorage.setItem(KEY_DATA, JSON.stringify(passwords));
            render();
            document.getElementById('modal').classList.remove('active');
            showToast('Deleted');
        }

        function render() {
            const search = document.getElementById('search').value.toLowerCase();
            const list = document.getElementById('list');
            
            let filtered = passwords;
            if (search) {
                filtered = filtered.filter(p => 
                    p.site.toLowerCase().includes(search) || 
                    p.user.toLowerCase().includes(search) ||
                    p.cat.toLowerCase().includes(search)
                );
            }
            
            if (filtered.length === 0) {
                list.innerHTML = '<div class="empty">No passwords yet. Tap + to add.</div>';
                return;
            }
            
            list.innerHTML = filtered.map(p => `
                <div class="item" onclick="edit(${p.id})">
                    <div class="site">${escape(p.site)}</div>
                    <div class="user">${escape(p.user) || 'No username'}</div>
                    <div class="meta">
                        <span>Updated: ${p.updated}</span>
                        <span class="cat-tag">${escape(p.cat)}</span>
                    </div>
                </div>
            `).join('');
        }

        function edit(id) {
            const p = passwords.find(x => x.id === id);
            if (!p) return;
            editingId = id;
            document.getElementById('modalTitle').textContent = 'Edit Password';
            document.getElementById('delBtn').classList.remove('hidden');
            document.getElementById('cat').value = p.cat;
            document.getElementById('site').value = p.site;
            document.getElementById('user').value = p.user;
            document.getElementById('pass').value = p.pass;
            document.getElementById('modal').classList.add('active');
        }

        function genPass() {
            const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789!@#$%^&*';
            let pass = '';
            for (let i = 0; i < 16; i++) pass += chars.charAt(Math.floor(Math.random() * chars.length));
            document.getElementById('pass').value = pass;
            document.getElementById('pass').type = 'text';
        }

        function openChangePass() {
            document.getElementById('oldPass').value = '';
            document.getElementById('newPass').value = '';
            document.getElementById('confirmPass').value = '';
            document.getElementById('changeModal').classList.add('active');
        }

        function changePass() {
            const oldP = document.getElementById('oldPass').value;
            const newP = document.getElementById('newPass').value;
            const conf = document.getElementById('confirmPass').value;
            
            if (oldP !== currentPass) {
                showToast('Current password is wrong');
                return;
            }
            if (!newP) {
                showToast('Enter new password');
                return;
            }
            if (newP !== conf) {
                showToast('Passwords do not match');
                return;
            }
            
            currentPass = newP;
            localStorage.setItem(KEY_PASS, newP);
            document.getElementById('changeModal').classList.remove('active');
            showToast('Password changed - your passwords are safe');
        }

        function escape(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function showToast(msg) {
            const t = document.getElementById('toast');
            t.textContent = msg;
            t.classList.add('show');
            setTimeout(() => t.classList.remove('show'), 2500);
        }
    </script>
</body>
</html>
